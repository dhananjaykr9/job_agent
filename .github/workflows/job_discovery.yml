name: Hourly Job Discovery Agent (8 AM - 10 PM IST)

on:
  schedule:
    # Runs hourly from 8:00 AM to 10:00 PM IST (02:30 to 16:30 UTC)
    # Minute 30 of every hour between 2 and 16 UTC = Minute 00 of 8 AM to 10 PM IST
    - cron: '30 2-16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub "Run workflow" button

# Grant write permissions to commit updated Excel tracker back to repo
permissions:
  contents: write

jobs:
  discover-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GOOGLE_SHEET_URL: "https://docs.google.com/spreadsheets/d/1Naq2pmSfyt8ulXpq-7SKFmXfaerYnvkbjSy83SXRmT0/edit?usp=sharing"
          EXCEL_FILE_PATH: ./jobs_tracker.xlsx
          DATABASE_URL: sqlite:///./job_agent.db
          LOG_LEVEL: INFO
        run: |
          python cli.py search

      - name: Commit & Push Updated Tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f jobs_tracker.xlsx job_agent.db
          git diff --staged --quiet || (git commit -m "Auto-update jobs tracker [skip ci]" && git pull --rebase && git push)
